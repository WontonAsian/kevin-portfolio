<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Static Page</title>
    <link rel="stylesheet" href="css/styles.min.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" class="nav-link" data-page="home">Home</a>
            <a href="#" class="nav-link" data-page="about">About</a>
            <a href="#" class="nav-link" data-page="contact">Contact</a>
        </nav>
    </header>

    <!-- Home Page -->
    <main class="page" data-page="home">
        <div class="content">
            <h1>Welcome to My Simple Static Page</h1>
            <p>Here is a picture of a mountain from the hike rock trail in Washington</p>
        </div>
        <div class="image-container">
            <img src="images/smallhighrock.JPG" alt="high rock mountain">
        </div>
    </main>

    <!-- About Page -->
    <main class="page" data-page="about">
        <div class="content">
            <h1>About Me</h1>
            <p>Here is the about page, and a picture of a motorcycle on highway</p>
        </div>
        <div>
            <img src="images/motercylce roller.JPG" alt="motorcycle photo">
        </div>
    </main>

    <!-- Contact Page -->
    <main class="page" data-page="contact">
        <div class="content">
            <h1>Contact</h1>
            <p>Here is the contact page, and a picture of the cascade in Seattle!</p>
        </div>
        <div>
            <img src="images/cascade.JPG" alt="cascade photo">
        </div>
    </main>

    <footer>
        <p>Kevin Nguyen 2025</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
